[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtkaudit"
version = "1.0.0"
description = "Code and evidence for 'High AUROC, Low Detection: Calibration and Reference Sensitivity in Model-Internal Jailbreak Detectors'"
readme = "README.md"
license = {text = "CC-BY-NC-4.0 (third-party portions: see THIRD_PARTY_NOTICES.md)"}
authors = [{name = "Mohammad Tehabsim"}, {name = "Basil Al-Housani"}, {name = "Nour Alhussain"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0", "scipy>=1.12", "scikit-learn>=1.5", "matplotlib>=3.8", "joblib", "tqdm",
    "torch>=2.4", "transformers==4.47.1",
]

[project.urls]
Repository = "https://github.com/Mtehabsim/internal-detector-sensititvity"

[project.optional-dependencies]
gpu = ["accelerate", "peft", "fschat==0.2.36", "sentencepiece"]
test = ["pytest"]                         # make test
data = ["pyarrow", "huggingface_hub"]     # rebuild_texts.py --wildchat (reads the pinned WildChat file)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtkaudit = ["*.jinja"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
